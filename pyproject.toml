[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diskd"
version = "0.1.0"
description = "Discrete Survival Knowledge Distillation for survival and competing-risks analysis."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Feiyang Deng" },
  { name = "Lingfeng Luo" },
  { name = "Di Wang" },
  { name = "Qinmengge Li" },
  { name = "Lingxuan Kong" },
  { name = "Kevin He" },
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "torch>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]
examples = [
  "matplotlib>=3.6",
]
experiments = [
  "matplotlib>=3.6",
  "scipy>=1.10",
]
tuning = [
  "optuna>=3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
